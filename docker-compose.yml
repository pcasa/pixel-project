services:
  pixel-hub:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      OMNIBOT_DATA_DIR: /data
      OMNIBOT_STATIC_ROOT: /app/backend/static
      HOST: "0.0.0.0"
      PORT: "8000"
      # Required: Claude API key (brain). Get at console.anthropic.com
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Required: Gemini API key (STT + TTS, free tier). Get at aistudio.google.com
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - pixel_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ping')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  pixel_data:
